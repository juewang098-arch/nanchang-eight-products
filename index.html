let filter='全部';const grid=document.querySelector('#grid');const total=DATA.products.reduce((a,p)=>a+p.current,0);const clothes=DATA.products.filter(p=>p.category!=='吊带/背心').reduce((a,p)=>a+p.current,0);const stats=[['指定商品',8,'款','仅截图所选商品'],['当前销量',total,'件','10月20日—27日'],['服装销量',clothes,'件','不含吊带 / 背心'],['最多销量',8,'件','EE6499001 · 吊带 / 背心']];document.querySelector('#stats').innerHTML=stats.map(s=>`<div class="stat"><small>${s[0]}</small><div><strong>${s[1]}</strong><em>${s[2]}</em></div><span class="caption">${s[3]}</span></div>`).join('');
function group(p){return ['牛仔裤','休闲裤'].includes(p.category)?'下装':p.category==='羽绒服'?'羽绒服':'上装'}
function render(){let products=DATA.products.filter(p=>filter==='全部'||group(p)===filter);if(document.querySelector('#sort').value==='quantity')products.sort((a,b)=>b.current-a.current);grid.innerHTML=products.map(p=>`<article class="card"><button class="photo" data-skc="${p.skc}" aria-label="查看${p.color}${p.category}${p.skc}大图"><img src="${p.image}" alt="${p.color}${p.category} ${p.skc}" ${DATA.products.indexOf(p)>3?'loading="lazy"':''}><span class="num">${String(DATA.products.indexOf(p)+1).padStart(2,'0')}</span>${p.offlineWave==='10B'?'<span class="tag">10B新品</span>':''}<span class="zoom">查看大图 ↗</span></button><div class="content"><div class="head"><div><h2 class="category">${p.category}</h2><div class="code">${p.skc}</div></div><div class="qty"><b>${p.current}</b><small>件 · 当前销量</small></div></div><div class="meta">${p.color} &nbsp;·&nbsp; ${p.season} &nbsp;·&nbsp; ${p.offlineWave||p.wave}波段</div><div class="comparison"><div class="barrow"><span>10.20—10.27</span><div class="track"><div class="fill" style="width:${p.current/8*100}%"></div></div><b>${p.current}</b></div><div class="barrow old"><span>10.19—10.26</span><div class="track"><div class="fill" style="width:${p.previous/8*100}%"></div></div><b>${p.previous}</b></div></div><div class="sizes" aria-label="尺码销量">${Object.entries(p.sizes).map(([s,n])=>`<div class="size ${n?'sold':''}"><span>${s}</span><b>${n}</b></div>`).join('')}</div></div></article>`).join('');}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>{x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()}));document.querySelector('#sort').addEventListener('change',render);const viewer=document.querySelector('#viewer');grid.addEventListener('click',e=>{const b=e.target.closest('[data-skc]');if(!b)return;const p=DATA.products.find(x=>x.skc===b.dataset.skc);document.querySelector('#large').src=p.image;document.querySelector('#large').alt=`${p.color}${p.category} ${p.skc}`;document.querySelector('#viewerLabel').textContent=`${p.category} · ${p.color} · ${p.skc}`;viewer.showModal()});document.querySelector('#close').addEventListener('click',()=>viewer.close());viewer.addEventListener('click',e=>{if(e.target===viewer&&e.clientY>viewer.getBoundingClientRect().bottom)viewer.close()});render();
</script></body></html>
